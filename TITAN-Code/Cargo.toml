[workspace]
resolver = "3"
members = [
    "crates/titan-text",
    "crates/titan-doc",
    "crates/titan-workspace",
    "crates/titan-protocol",
    "crates/titan-index",
    "crates/titan-tasks",
    "crates/titan-recovery",
    "crates/titan-watch",
    "crates/titan-server",
    "crates/titan-lsp",
    "crates/titan-changes",
    "crates/titan-bench",
    "crates/titan-verify",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
# ropey: Unicode line breaks off; LF, CRLF and lone CR are recognised (LSP-compatible).
ropey = { version = "1.6", default-features = false, features = ["simd", "cr_lines"] }
unicode-segmentation = "1.12"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
tempfile = "3"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
crc32fast = "1.4"
# BLAKE3 content fingerprints for integrity decisions (titan-doc::ContentHash).
blake3 = "1.8"
# Cargo manifests for the project graph.
toml = "1.2"
# renameat2(RENAME_EXCHANGE) / renameatx_np(RENAME_SWAP) for conflict-safe saves.
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }
# notify: inotify / FSEvents / ReadDirectoryChangesW backends (ADR 0005).
notify = "8.2"

titan-text = { path = "crates/titan-text" }
titan-doc = { path = "crates/titan-doc" }
titan-workspace = { path = "crates/titan-workspace" }
titan-protocol = { path = "crates/titan-protocol" }
titan-index = { path = "crates/titan-index" }
titan-tasks = { path = "crates/titan-tasks" }
titan-recovery = { path = "crates/titan-recovery" }
titan-watch = { path = "crates/titan-watch" }
titan-lsp = { path = "crates/titan-lsp" }
titan-verify = { path = "crates/titan-verify" }
titan-changes = { path = "crates/titan-changes" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = 1
